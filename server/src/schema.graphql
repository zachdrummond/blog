type Query {
    getAuthors(author_ids: [Int], emails: [String!], role: Role, usernames: [String!]): [Author!]!
    getPosts(post_ids: [Int!], author_ids: [Int!], titles: [String!], categories: [String!], published: Boolean, skip: Int, take: Int, order_by: PostOrderBy): Feed!
}

type Mutation {
    addPost(title: String!, content: String!, categories: [String!]!, published: Boolean): Post!
    deleteAuthor(author_id: Int, email: String): Author!
    deletePost(post_id: Int, title: String): Post!
    incrementPost(post_id: Int!, type: IncrementType!): Post!
    login(email: String!, password: String!): AuthPayload
    signup(email: String!, password: String!, first_name: String!, last_name: String!, username: String!): AuthPayload
    updateAuthor(author_id: Int!, first_name: String, last_name: String, email: String, role: Role, username: String): Author!
    updatePost(post_id: Int!, title: String, content: String, categories: [String!], published: Boolean): Post!
}

directive @auth(requires: Role = ADMIN) on FIELD_DEFINITION

type AuthPayload {
  token: String
  author: Author
}

type Author {
  author_id: Int!
  date_created: Date!
  date_updated: Date!
  posts: [Post!]
  username: String!

  # Protected fields
  email: String @auth(requires: ADMIN)
  password: String @auth(requires: ADMIN)
  first_name: String @auth(requires: ADMIN)
  last_name: String @auth(requires: ADMIN)
  role: Role! @auth(requires: ADMIN)
}

type Feed {
  total: Int!
  items: [Post!]!
}

type Post {
  post_id: Int!
  author: Author!
  author_id: Int!
  categories: [String!]!
  content: String!
  date_created: Date!
  date_updated: Date!
  likes: Int
  published: Boolean!
  shares: Int
  title: String!
  views: Int
}

input PostOrderBy {
  date_created: Sort
  date_updated: Sort
  likes: Sort
  shares: Sort
  title: Sort
  views: Sort
}

scalar Date

enum IncrementType {
  LIKE
  SHARE
  VIEW
}

enum Role {
  ADMIN
  AUTHOR
}

enum Sort {
  asc
  desc
}