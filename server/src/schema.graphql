type Query {
    getAllPosts(skip: Int, take: Int, orderBy: PostOrderBy): Feed!
    getAllAuthors: [Author!]!
    getAuthors(ids: [ID], emails: [String!], role: Role, usernames: [String!]): [Author!]!
    getPosts(ids: [ID], titles: [String!], categories: [String!]): [Post!]!
}

type Mutation {
    addPost(title: String!, content: String!, categories: [String!]!, published: Boolean): Post!
    deleteAuthor(id: ID, email: String): Author!
    deletePost(id: ID, title: String): Post!
    incrementPost(id: ID!, type: IncrementType!): Post!
    login(email: String!, password: String!): AuthPayload
    signup(email: String!, password: String!, first_name: String!, last_name: String!, username: String!): AuthPayload
    updateAuthor(id: ID!, first_name: String, last_name: String, email: String, role: Role, username: String): Author!
    updatePost(id: ID!, title: String, content: String, categories: [String!], published: Boolean): Post!
}

directive @auth(requires: Role = ADMIN) on FIELD_DEFINITION

type AuthPayload {
  token: String
  author: Author
}

type Author {
  id: ID!
  createdAt: String!
  posts: [Post!]!
  updatedAt: String
  username: String!

  # Protected fields
  email: String @auth(requires: ADMIN)
  password: String @auth(requires: ADMIN)
  first_name: String @auth(requires: ADMIN)
  last_name: String @auth(requires: ADMIN)
  role: Role @auth(requires: ADMIN)
}

type Feed {
  total: Int!
  items: [Post!]!
}

type Post {
  id: ID!
  author: Author!
  authorId: ID!
  categories: [String!]!
  content: String!
  createdAt: String!
  likes: Int
  published: Boolean!
  shares: Int
  title: String!
  updatedAt: String
  views: Int
}

input PostOrderBy {
  createdAt: Sort
  likes: Sort
  shares: Sort
  title: Sort
  updatedAt: Sort
  views: Sort
}

enum IncrementType {
  LIKE
  SHARE
  VIEW
}

enum Role {
  ADMIN
  AUTHOR
}

enum Sort {
  asc
  desc
}