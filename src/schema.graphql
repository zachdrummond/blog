type Query {
    getAllPosts: [Post!]!
    getPosts(ids: [ID], titles: [String!], categories: [String!]): [Post!]!
}

type Mutation {
    addPost(title: String!, content: String!, categories: [String!]!, published: Boolean): Post!
    deletePost(id: ID!): Post!
    login(email: String!, password: String!): AuthPayload
    updatePost(id: ID!, title: String, content: String, categories: [String!], published: Boolean): Post!
}

type AuthPayload {
  token: String
  user: Author
}

type Author {
  id: ID!
  createdAt: String!
  email: String!
  first_name: String!
  last_name: String!
  posts: [Post!]!
  role: Role!
  updatedAt: String
  username: String!
}

type Post {
  id: ID!
  author: Author!
  authorId: ID!
  categories: [String!]!
  content: String!
  createdAt: String!
  likes: Int
  published: Boolean!
  title: String!
  updatedAt: String
  views: Int
}

enum Role {
  ADMIN
  USER
}