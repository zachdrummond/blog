type Query {
    getAllPosts: [Post!]!
    getPosts(ids: [ID], titles: [String]): [Post!]!
}

type Mutation {
    addPost(title: String!, content: String!, published: Boolean): Post!
    deletePost(id: ID, title: String): Post!
    updatePost(id: ID!, title: String, content: String, published: Boolean): Post!
}

type Post {
  id: ID!
  content: String!
  createdAt: String!
  published: Boolean!
  title: String!
  updatedAt: String
}